name: Screenshots

# Manual only: captures the app on an iPhone simulator, seeded from TestROMs/, and uploads
# the PNGs as an artifact. By default it takes the App Store listing set on the 6.3-inch
# iPhone 17 Pro; each device checks its dimensions against its App Store Connect slot.

on:
  workflow_dispatch:
    inputs:
      device:
        description: iPhone 17 Pro for the 6.1" and 6.3" slot App Store Connect asks for now; Pro Max for 6.9-inch, 14 Plus for 6.5-inch
        type: choice
        options: [iPhone 17 Pro, iPhone 17 Pro Max, iPhone 14 Plus]
        default: iPhone 17 Pro
      roms:
        description: "hero, all, or comma-separated manifest tags and filenames"
        default: hero
        required: true
      shots:
        description: listing is the nine App Store screenshots in order; summary is every screen and menu for review; every-rom adds each ROM's screens
        type: choice
        options: [listing, summary, every-rom]
        default: listing
      appearance:
        description: Simulator appearance; both runs a light and a dark job side by side
        type: choice
        options: [both, light, dark]
        default: both
      text_size:
        description: Text size; largest checks layouts at the biggest accessibility size
        type: choice
        options: [default, largest]
        default: default
      import_rom:
        description: The ROM the import review opens (never seeded); gbdk450-badsum.gb shows the checksum warning
        default: zgb-dmg.gb
        required: true
      game_url:
        description: "Optional: a downloadable .gb, .gbc or .zip for the gameplay shots, used instead of SCREENSHOT_GAME_URL"
        default: ""
      game_sha256:
        description: The game's SHA-256, needed with game_url
        default: ""
      game_name:
        description: "Optional: the game's name in the library; the ROM header's title when empty"
        default: ""
      game_input:
        description: "Optional: a button script the game's gameplay shots play first, then | and each shot's wait (docs/testflight.md)"
        default: ""

permissions:
  contents: read

jobs:
  screenshots:
    name: Simulator screenshots (${{ matrix.appearance }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        appearance: ${{ fromJSON(inputs.appearance == 'both' && '["light","dark"]' || format('["{0}"]', inputs.appearance)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install XcodeGen and RGBDS
        run: brew install xcodegen rgbds
      - name: Bootstrap (boot ROMs and Xcode project)
        run: make bootstrap
      - name: Prepare screenshot simulator
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          def listing(kind):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", kind, "-j"]))

          name = os.environ["DEVICE"]
          devices = listing("devices")["devices"]
          if not any(d["name"] == name and d.get("isAvailable")
                     for runtime, group in devices.items() if ".iOS-" in runtime for d in group):
              device_type = next(d for d in listing("devicetypes")["devicetypes"] if d["name"] == name)
              runtimes = [r for r in listing("runtimes")["runtimes"]
                          if r.get("isAvailable") and ".iOS-" in r["identifier"]]
              runtime = max(runtimes, key=lambda r: tuple(map(int, r["version"].split("."))))
              subprocess.run(["xcrun", "simctl", "create", name, device_type["identifier"],
                              runtime["identifier"]], check=True)
          PY
      - name: Take screenshots
        env:
          DEVICE: ${{ inputs.device }}
          ROMS: ${{ inputs.roms }}
          SHOTS: ${{ inputs.shots }}
          APPEARANCE: ${{ matrix.appearance }}
          TEXT_SIZE: ${{ inputs.text_size == 'largest' && 'accessibility-extra-extra-extra-large' || 'default' }}
          IMPORT_ROM: ${{ inputs.import_rom }}
          # A real game for the gameplay shots, kept out of the repository: pass it when running
          # the workflow, or set the SCREENSHOT_GAME_* repository variables, to a downloadable
          # .gb, .gbc or .zip whose author allows its use, and its SHA-256, with an optional
          # button script that gets it past its intro. With neither, the test ROMs play.
          GAME_URL: ${{ inputs.game_url || vars.SCREENSHOT_GAME_URL }}
          GAME_SHA256: ${{ inputs.game_url && inputs.game_sha256 || vars.SCREENSHOT_GAME_SHA256 }}
          # A game given when running the workflow brings its own name and script, even empty ones,
          # since the variables' are for their game.
          GAME_NAME: ${{ inputs.game_url && inputs.game_name || !inputs.game_url && vars.SCREENSHOT_GAME_NAME || '' }}
          GAME_INPUT: ${{ inputs.game_url && inputs.game_input || !inputs.game_url && vars.SCREENSHOT_GAME_INPUT || '' }}
        run: |
          set -o pipefail
          ./Scripts/take-screenshots.sh "$ROMS" screenshots 2>&1 | tee screenshots.log
      - name: Verify App Store screenshot dimensions
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import struct

          # The size each device's slot in App Store Connect takes. The 6.1-inch and 6.3-inch slot
          # takes 1206 x 2622 (and 1179 x 2556), and it refuses the larger sizes.
          slots = {
              "iPhone 17 Pro": ((1206, 2622), "6.3-inch"),
              "iPhone 17 Pro Max": ((1320, 2868), "6.9-inch"),
              "iPhone 14 Plus": ((1284, 2778), "6.5-inch"),
          }
          expected, slot = slots[os.environ["DEVICE"]]

          images = sorted(Path("screenshots").rglob("*.png"))
          if not images:
              raise SystemExit("No screenshot PNGs were generated.")
          for image in images:
              with image.open("rb") as source:
                  header = source.read(24)
              if header[:8] != b"\x89PNG\r\n\x1a\n" or header[12:16] != b"IHDR":
                  raise SystemExit(f"Invalid PNG: {image}")
              size = struct.unpack(">II", header[16:24])
              if size not in (expected, expected[::-1]):
                  raise SystemExit(f"{image}: {size} does not fit Apple's {slot} slot.")
              print(f"Verified {image}: {size[0]} x {size[1]}")
          PY
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ matrix.appearance }}${{ inputs.device == 'iPhone 14 Plus' && '-6.5-inch' || inputs.device == 'iPhone 17 Pro Max' && '-6.9-inch' || '-6.3-inch' }}${{ inputs.text_size == 'largest' && '-largest-text' || '' }}
          path: |
            screenshots/
            screenshots.log
          if-no-files-found: error
