name: Screenshots

# Manual only: captures the app on an iPhone simulator, seeded from TestROMs/, and uploads
# the PNGs as an artifact. By default it takes the App Store listing set on the 6.9-inch
# iPhone 17 Pro Max; the 6.5-inch and 6.9-inch presets check dimensions before upload.

on:
  workflow_dispatch:
    inputs:
      device:
        description: Pro Max for Apple's 6.9-inch slot, which smaller iPhones scale from; 14 Plus for the 6.5-inch slot
        type: choice
        options: [iPhone 17 Pro Max, iPhone 14 Plus, iPhone 17 Pro]
        default: iPhone 17 Pro Max
      roms:
        description: "hero, all, or comma-separated manifest tags and filenames"
        default: hero
        required: true
      shots:
        description: listing is the ten App Store screenshots in order; summary is every screen and menu for review; every-rom adds each ROM's screens
        type: choice
        options: [listing, summary, every-rom]
        default: listing
      appearance:
        description: Simulator appearance; both runs a light and a dark job side by side
        type: choice
        options: [both, light, dark]
        default: both
      text_size:
        description: Text size; largest checks layouts at the biggest accessibility size
        type: choice
        options: [default, largest]
        default: default
      import_rom:
        description: The ROM the import review opens (never seeded); gbdk450-badsum.gb shows the checksum warning
        default: zgb-dmg.gb
        required: true

permissions:
  contents: read

jobs:
  screenshots:
    name: Simulator screenshots (${{ matrix.appearance }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        appearance: ${{ fromJSON(inputs.appearance == 'both' && '["light","dark"]' || format('["{0}"]', inputs.appearance)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install XcodeGen and RGBDS
        run: brew install xcodegen rgbds
      - name: Bootstrap (boot ROMs and Xcode project)
        run: make bootstrap
      - name: Prepare screenshot simulator
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          def listing(kind):
              return json.loads(subprocess.check_output(["xcrun", "simctl", "list", kind, "-j"]))

          name = os.environ["DEVICE"]
          devices = listing("devices")["devices"]
          if not any(d["name"] == name and d.get("isAvailable")
                     for runtime, group in devices.items() if ".iOS-" in runtime for d in group):
              device_type = next(d for d in listing("devicetypes")["devicetypes"] if d["name"] == name)
              runtimes = [r for r in listing("runtimes")["runtimes"]
                          if r.get("isAvailable") and ".iOS-" in r["identifier"]]
              runtime = max(runtimes, key=lambda r: tuple(map(int, r["version"].split("."))))
              subprocess.run(["xcrun", "simctl", "create", name, device_type["identifier"],
                              runtime["identifier"]], check=True)
          PY
      - name: Take screenshots
        env:
          DEVICE: ${{ inputs.device }}
          ROMS: ${{ inputs.roms }}
          SHOTS: ${{ inputs.shots }}
          APPEARANCE: ${{ matrix.appearance }}
          TEXT_SIZE: ${{ inputs.text_size == 'largest' && 'accessibility-extra-extra-extra-large' || 'default' }}
          IMPORT_ROM: ${{ inputs.import_rom }}
          # A real game for the gameplay shots, kept out of the repository: set these repository
          # variables to a downloadable .gb, .gbc or .zip whose author allows its use, and its
          # SHA-256. Unset, the test ROMs play.
          GAME_URL: ${{ vars.SCREENSHOT_GAME_URL }}
          GAME_SHA256: ${{ vars.SCREENSHOT_GAME_SHA256 }}
          GAME_NAME: ${{ vars.SCREENSHOT_GAME_NAME }}
        run: |
          set -o pipefail
          ./Scripts/take-screenshots.sh "$ROMS" screenshots 2>&1 | tee screenshots.log
      - name: Verify App Store screenshot dimensions
        if: inputs.device != 'iPhone 17 Pro'
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import struct

          # Apple's 6.5-inch slot takes the 14 Plus's size and the 6.9-inch slot the Pro Max's.
          expected = (1284, 2778) if os.environ["DEVICE"] == "iPhone 14 Plus" else (1320, 2868)
          slot = "6.5-inch" if expected == (1284, 2778) else "6.9-inch"

          images = sorted(Path("screenshots").rglob("*.png"))
          if not images:
              raise SystemExit("No screenshot PNGs were generated.")
          for image in images:
              with image.open("rb") as source:
                  header = source.read(24)
              if header[:8] != b"\x89PNG\r\n\x1a\n" or header[12:16] != b"IHDR":
                  raise SystemExit(f"Invalid PNG: {image}")
              size = struct.unpack(">II", header[16:24])
              if size not in (expected, expected[::-1]):
                  raise SystemExit(f"{image}: {size} does not fit Apple's {slot} slot.")
              print(f"Verified {image}: {size[0]} x {size[1]}")
          PY
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ matrix.appearance }}${{ inputs.device == 'iPhone 14 Plus' && '-6.5-inch' || inputs.device == 'iPhone 17 Pro Max' && '-6.9-inch' || '' }}${{ inputs.text_size == 'largest' && '-largest-text' || '' }}
          path: |
            screenshots/
            screenshots.log
          if-no-files-found: error
