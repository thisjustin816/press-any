          Path('App/Settings/GameplayPresetRow.swift').write_text(r'''import EmulatorApplication
import EmulatorDomain
import SwiftUI

struct GameplayPresetRow: View {
    let scope: SettingsScope
    let system: GameSystem
    let gameID: UUID?
    let buildID: UUID?
    let hardware: HardwareModel
    let store: any SettingsStore
    @ObservedObject var plus: PlusStore
    let refreshToken: Int
    let onChange: () -> Void

    @State private var preset: GameplayPreset = .custom
    @State private var errorMessage: String?
    @State private var showsPlus = false

    var body: some View {
        Menu {
            Button(GameplayPreset.raw.displayName) { choose(.raw) }
            Button(plus.gate.label(GameplayPreset.accurate.displayName, needsPlus: accurateNeedsPlus)) {
                choose(.accurate)
            }
            Button(GameplayPreset.custom.displayName) {}
                .disabled(true)
            Divider()
            Button("Reset to Inherited") { reset() }
        } label: {
            HStack {
                VStack(alignment: .leading, spacing: 2) {
                    HStack(spacing: 6) {
                        Text("Preset").foregroundStyle(Color.primary)
                        if plus.gate.isLocked(accurateNeedsPlus) { PlusBadge() }
                    }
                    Text(errorMessage ?? detail)
                        .font(.subheadline)
                        .foregroundStyle(errorMessage == nil ? Color.secondary : Color.red)
                }
                Spacer(minLength: 12)
                HStack(spacing: 4) {
                    Text(plus.gate.label(preset.displayName, needsPlus: preset == .accurate && accurateNeedsPlus))
                    Image(systemName: "chevron.up.chevron.down").imageScale(.small)
                }
                .foregroundStyle(Color.secondary)
            }
            .contentShape(Rectangle())
        }
        .accessibilityLabel("Gameplay Preset")
        .accessibilityValue("\(preset.displayName), \(errorMessage ?? detail)")
        .plusSheet(isPresented: $showsPlus, store: plus)
        .onAppear(perform: load)
        .onChange(of: refreshToken) { load() }
        .onChange(of: hardware) { load() }
    }

    private var accurateNeedsPlus: Bool {
        GameplayPresetValues.values(for: .accurate, hardware: hardware)?.displayFilter.needsPlus ?? false
    }

    private var detail: String {
        switch preset {
        case .raw: "Unfiltered emulated output"
        case .accurate: "Matched to \(hardware.displayName)"
        case .custom: "Advanced settings differ from Raw or Accurate"
        }
    }

    private func choose(_ newPreset: GameplayPreset) {
        guard newPreset != .custom else { return }
        if newPreset == .accurate, plus.gate.isLocked(accurateNeedsPlus) {
            showsPlus = true
            return
        }
        do {
            try GameplayPresetSettings(store: store).apply(newPreset, at: scope, hardware: hardware)
            preset = newPreset
            errorMessage = nil
            onChange()
            load()
        } catch {
            errorMessage = "Could not save the preset: \(error.localizedDescription)"
        }
    }

    private func reset() {
        do {
            try GameplayPresetSettings(store: store).reset(at: scope)
            errorMessage = nil
            onChange()
            load()
        } catch {
            errorMessage = "Could not reset the preset: \(error.localizedDescription)"
        }
    }

    private func load() {
        do {
            preset = try GameplayPresetSettings(store: store).resolvedPreset(
                system: system,
                gameID: gameID,
                buildID: buildID,
                hardware: hardware
            )
            errorMessage = nil
        } catch {
            preset = .custom
            errorMessage = "Could not read the preset: \(error.localizedDescription)"
        }
    }
}
''')

          # Plus copy and tests now describe all display filters, not just the original LCD pair.
          entitlement = Path('App/Plus/FeatureEntitlementProvider.swift')
          s = entitlement.read_text().replace('/// LCD 1× and LCD 3× are Plus features. Off stays free.',
                                              '/// Built-in display filters are Plus features. Off stays free.')
          entitlement.write_text(s)

          roadmap = Path('App/Plus/PlusRoadmap.swift')
          s = roadmap.read_text().replace(
              'Item(title: "LCD Filters", detail: "LCD 1× adds a subtle pixel grid, and LCD 3× red, green and blue subpixels."),',
              'Item(title: "Display Filters", detail: "LCD filters cover handheld screens; CRT 240p and GameCube TV cover television-output models."),'
          )
          roadmap.write_text(s)

          plus_tests = Path('AppTests/PlusTests.swift')
          s = plus_tests.read_text().replace('"LCD Filters", "App Icons"', '"Display Filters", "App Icons"')
          plus_tests.write_text(s)

          # Deterministic GPU tests distinguish the two new television treatments while keeping the
          # existing Off/LCD expectations unchanged.
          tests = Path('AppTests/LCDFilterTests.swift')
          s = tests.read_text()
          anchor = '''    /// Frame blending mixes the newest frame with the frames before it by the renderer's weights,\n'''
          tv_test = r'''    func testTVFiltersUseDistinctBeamStrengths() throws {
        guard let device = MTLCreateSystemDefaultDevice(), let library = device.makeDefaultLibrary() else {
            throw XCTSkip("Metal isn't available")
        }
        for fragment in ["gameplayTextureFragment", "gameplaySharpFragment"] {
            let crt = try render(.crt240p, fragment: fragment, device: device, library: library)
            let tv = try render(.gameCubeTV, fragment: fragment, device: device, library: library)
            let edge = pixel(12, 1)
            let center = pixel(12, 12)
            let crtDrop = Int(crt[center]) - Int(crt[edge])
            let tvDrop = Int(tv[center]) - Int(tv[edge])
            XCTAssertGreaterThan(crtDrop, 0, "CRT 240p must show a visible beam profile")
            XCTAssertGreaterThan(tvDrop, 0, "GameCube TV keeps a restrained beam profile")
            XCTAssertGreaterThan(crtDrop, tvDrop, "CRT 240p must be stronger than GameCube TV")
            XCTAssertNotEqual(crt, tv)
        }
    }

'''
          if anchor not in s:
              raise SystemExit('LCDFilterTests insertion anchor changed')
          s = s.replace(anchor, tv_test + anchor, 1)
          tests.write_text(s)

          # Product documentation: old low-level settings keep their behavior; the preset is a
          # derived abstraction and TV output is deliberately separate from handheld LCD output.
          readme = Path('README.md')
          s = readme.read_text().replace('adds LCD filters, alternate app', 'adds display filters, alternate app')
          readme.write_text(s)

          product = Path('docs/product.md')
          s = product.read_text().replace(
              '- **LCD filters**: LCD 1× and LCD 3× (see Picture).',
              '- **Display filters**: LCD 1×, LCD 3×, CRT 240p and GameCube TV (see Picture).'
          )
          picture_anchor = '### Picture\n\n'
          picture_copy = '''### Picture\n\nFrom System settings down through Game and Build, **Gameplay Preset** groups the authenticity\nsettings without replacing them. **Raw** removes display filtering, frame blending, display color\ncorrection and button-contact bounce. **Accurate** writes a curated combination for the selected\nModel: handheld models use their matching LCD treatment and screen colors, Super Game Boy models\nuse a restrained consumer 240p CRT treatment, and Game Boy Player uses a cleaner GameCube-era TV\ntreatment. Editing any controlled setting makes the displayed preset **Custom**; returning every\nvalue to a built-in combination recognizes Raw or Accurate again. The preset itself is not stored,\nso existing settings and App -> System -> Game -> Build inheritance keep their behavior.\n\n'''
          if picture_anchor not in s:
              raise SystemExit('product Picture anchor changed')
          s = s.replace(picture_anchor, picture_copy, 1)
          product.write_text(s)

          backlog = Path('docs/backlog.md')
          s = backlog.read_text().replace(
              'the Model setting and hardware-family checks; automatic artwork previews,',
              'the Model setting and hardware-family checks; Raw/Accurate/Custom gameplay presets and model-specific display filters; automatic artwork previews,'
          )
          s = s.replace(
              '| partial | Curated display/shader set (LCD 1×, LCD 3×, Pixel Transparency, DMG/GBC LCD, sharp bilinear, CRT/scanlines); BuiltIn + CommunityDownload catalog with license/hash checks | v2.0 | LCD 1× pixel grid and LCD 3× RGB subpixel effects implemented as Press Any\'s own code,',
              '| partial | Curated display/shader set (LCD 1×, LCD 3×, Pixel Transparency, DMG/GBC LCD, sharp bilinear, CRT/scanlines); BuiltIn + CommunityDownload catalog with license/hash checks | v2.0 | v1.1 has Press Any\'s own LCD 1×/3× filters plus curated CRT 240p for Super Game Boy and GameCube TV for Game Boy Player; the broader shader catalog remains v2.0,'
          )
          backlog.write_text(s)

          verification = Path('docs/mvp-verification.md')
          s = verification.read_text() + '''\n\n## v1.1 gameplay presets and television filters\n\n- [ ] On GB, Pocket, GBC and GBA models, choose Accurate and confirm the advanced rows immediately show the documented LCD/color/blending/button values; change one and confirm the preset becomes Custom.\n- [ ] Choose Raw, confirm Display Filter and Frame Blending are Off and Button Bounce is Off, then reset the preset and confirm inherited values return.\n- [ ] On Super Game Boy/Super Game Boy 2, Accurate shows CRT 240p with visible but restrained scanlines/softness and no handheld LCD subpixel pattern.\n- [ ] On Game Boy Player, Accurate shows the cleaner GameCube TV treatment, visibly distinct from CRT 240p and without assuming a curved or flat CRT.\n- [ ] Without Plus, choosing Accurate opens Press Any Plus and does not change the stored low-level settings. Raw remains selectable.\n'''
          verification.write_text(s)

          # Keep the old launch argument name for screenshot automation, but accept every new raw
          # DisplayFilter value through the broader type.
          # Sanity checks on the transformation before compiling.
          assert 'public enum LCDFilter' not in settings.read_text()
          assert 'case .crt240p: 4' in renderer.read_text()
          assert 'GameplayPresetRow(' in scoped.read_text()
          PY

      - name: Build RGBDS and open boot ROMs
        shell: bash
        run: |
          git clone -q --depth 1 --branch v0.9.0 https://github.com/gbdev/rgbds /tmp/rgbds
          cmake -S /tmp/rgbds -B /tmp/rgbds/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/rgbds/build -j "$(nproc)" >/dev/null
          cmake --install /tmp/rgbds/build >/dev/null
          make bootroms
      - name: Run portable package tests
        run: swift test --package-path Packages/EmulatorKit
      - name: Parse changed app Swift
        shell: bash
        run: |
          swiftc -frontend -parse App/Settings/GameplayPresetRow.swift
          swiftc -frontend -parse App/Settings/ScopedSettingsView.swift
          swiftc -frontend -parse App/Settings/AppSettingsPages.swift
          swiftc -frontend -parse App/Gameplay/MetalRenderer.swift
          swiftc -frontend -parse App/AppContainer.swift
          swiftc -frontend -parse App/Screenshots/ScreenshotScene.swift
          swiftc -frontend -parse AppTests/LCDFilterTests.swift
      - name: Check diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Justin Beeson"
          git config user.email "41129295+thisjustin816@users.noreply.github.com"
          git add App AppTests Packages/EmulatorKit README.md docs
          git commit -m "Add gameplay presets and TV display filters"
          git push origin HEAD:feature/gameplay-presets
