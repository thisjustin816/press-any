name: iOS build

# L4a Apple SDK and simulator gates (docs/acceptance-matrix.md).
# Physical-iPhone verification is separate and stays manual: docs/mvp-verification.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-file-ui:
    name: Shared ROM and patch UI flows
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install XcodeGen and RGBDS
        run: brew install xcodegen rgbds
      - name: Bootstrap (boot ROMs and Xcode project)
        run: make bootstrap
      - name: Share-sheet UI tests and refresh regression control
        run: make test-share-ui
      - name: Upload UI results and failure screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shared-file-ui-results
          path: |
            build/share-ui/*.log
            build/share-ui/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  simulator:
    name: Xcode simulator build and tests
    # The Makefile targets the iPhone 17 Pro simulator, which needs the Xcode 26 runner image.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | grep -i 'iPhone 17 Pro' || true
      - name: Install XcodeGen and RGBDS
        run: brew install xcodegen rgbds
      - name: Bootstrap (boot ROMs and Xcode project)
        run: make bootstrap
      - name: Build
        run: |
          set -o pipefail
          make build 2>&1 | tee build.log
      - name: Check the privacy manifest in the built app
        run: ./Scripts/verify-privacy-manifest.sh
      - name: Test
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log
      # xcodebuild prints thousands of long command lines, so the failure is hard to find in
      # the raw log. Repeat only the diagnostics, once, at the end.
      - name: Summarize failures
        if: failure()
        run: |
          {
            echo '### Xcode diagnostics'
            echo '```'
            grep -hE ' error: |✘|BUILD FAILED|TEST FAILED|\*\* .* FAILED|Testing failed' build.log test.log 2>/dev/null | sort -u | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The EmulatorKit tests also run on Linux in ci.yml. Running them here exercises the same code
  # against Apple's Foundation, which differs from Linux Foundation in Sendable conformances and
  # file-system behavior.
  package-tests:
    name: Package tests on the iOS simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Show toolchain and package schemes
        run: |
          xcodebuild -version
          (cd Packages/EmulatorKit && xcodebuild -list)
      # With boot ROMs bundled, the SameBoy adapter tests run the real boot sequence instead of skipping.
      - name: Install RGBDS
        run: brew install rgbds
      - name: Generate boot ROMs
        run: make bootroms
      - name: Test
        run: |
          set -o pipefail
          make test-package-ios 2>&1 | tee test.log
      - name: Summarize failures
        if: failure()
        run: |
          {
            echo '### Xcode diagnostics'
            echo '```'
            grep -hE ' error: |✘|BUILD FAILED|TEST FAILED|\*\* .* FAILED|Testing failed' test.log 2>/dev/null | sort -u | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The TestFlight workflow archives in Release for a device, which these simulator Debug builds
  # don't compile. An unsigned archive here catches a Release-only failure before an upload.
  release-archive:
    name: Unsigned Release archive
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install XcodeGen and RGBDS
        run: brew install xcodegen rgbds
      - name: Bootstrap (boot ROMs and Xcode project)
        run: make bootstrap
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PressAny.xcodeproj -scheme PressAny -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PressAny.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee archive.log
      - name: Check the privacy manifest in the archived app
        run: ./Scripts/verify-privacy-manifest.sh "$RUNNER_TEMP/PressAny.xcarchive/Products/Applications/PressAny.app"
      - name: Summarize failures
        if: failure()
        run: |
          {
            echo '### Xcode diagnostics'
            echo '```'
            grep -hE ' error: |ARCHIVE FAILED|\*\* .* FAILED' archive.log 2>/dev/null | sort -u | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
