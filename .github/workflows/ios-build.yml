name: iOS build

# L4a Apple SDK and simulator gates (docs/acceptance-matrix.md).
# Physical-iPhone verification is separate and stays manual: docs/mvp-verification.md.

on:
  # A change to docs alone can't break a build or a test, so it starts no run.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      share_ui_controls:
        description: Also run the share-sheet regression controls, which rebuild the app for each
        type: boolean
        default: false
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

# A newer push to a pull request replaces its running build. On main every build runs to the end,
# because the TestFlight workflow uploads only a build that succeeded; cancelling one for the next
# merge left nothing to upload. A newer main push waits its turn instead.
concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  share-ui-changes:
    name: Select shared-file UI coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.paths.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Both sides of a rename are checked, including a file moved out of a covered path.
          required="$(git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" -- |
            python3 Scripts/share-ui-paths.py)"
          echo "required=$required" >>"$GITHUB_OUTPUT"

  # Main's push skips the suite; affected pull requests, manual runs and the nightly run cover it.
  shared-file-ui:
    name: Shared ROM and patch UI flows
    needs: share-ui-changes
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
        needs.share-ui-changes.outputs.required == 'true')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install XcodeGen and RGBDS
        run: brew install xcodegen rgbds
      - name: Bootstrap (boot ROMs and Xcode project)
        run: make bootstrap
      - name: Share-sheet UI tests
        env:
          SHARE_UI_CONTROLS: ${{ inputs.share_ui_controls && '1' || '0' }}
        run: make test-share-ui
      - name: Export UI attachments
        if: always()
        run: |
          for result in build/share-ui/*.xcresult; do
            [ -d "$result" ] || continue
            name="$(basename "$result" .xcresult)"
            xcrun xcresulttool export attachments --path "$result" --output-path "build/share-ui/attachments/$name"
          done
      - name: Upload UI results and failure screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shared-file-ui-results
          path: |
            build/share-ui/*.log
            build/share-ui/*.xcresult
            build/share-ui/attachments/
          if-no-files-found: ignore
          retention-days: 7

  # The app, package and Release archive checks share one runner, since the account runs only a
  # few macOS jobs at once. The package tests and the archive run even when the app's build or
  # tests failed, so one push reports each kind of failure.
  build-and-test:
    name: Xcode build, tests and Release archive
    if: github.event_name != 'schedule'
    # The Makefile targets the iPhone 17 Pro simulator, which needs the Xcode 26 runner image.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | grep -i 'iPhone 17 Pro' || true
      - name: Install XcodeGen and RGBDS
        run: brew install xcodegen rgbds
      - name: Bootstrap (boot ROMs and Xcode project)
        id: bootstrap
        run: make bootstrap
      - name: Build
        run: |
          set -o pipefail
          make build 2>&1 | tee build.log
      - name: Check the privacy manifest in the built app
        run: ./Scripts/verify-privacy-manifest.sh
      - name: App tests
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log
      # The EmulatorKit tests also run on Linux in ci.yml. Running them here exercises the same
      # code against Apple's Foundation, which differs from Linux Foundation in Sendable
      # conformances and file-system behavior. With boot ROMs bundled, the SameBoy adapter tests
      # run the real boot sequence instead of skipping.
      - name: Package tests
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          set -o pipefail
          make test-package-ios 2>&1 | tee package-test.log
      # The TestFlight workflow archives in Release for a device, which the simulator Debug build
      # doesn't compile. Main's build skips this, since TestFlight's signed archive follows it.
      - name: Unsigned Release archive
        id: archive
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && github.event_name != 'push' }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PressAny.xcodeproj -scheme PressAny -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PressAny.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee archive.log
      - name: Check the privacy manifest in the archived app
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        run: ./Scripts/verify-privacy-manifest.sh "$RUNNER_TEMP/PressAny.xcarchive/Products/Applications/PressAny.app"
      # xcodebuild prints thousands of long command lines, so the failure is hard to find in
      # the raw log. Repeat only the diagnostics, once, at the end.
      - name: Summarize failures
        if: failure()
        run: |
          {
            echo '### Xcode diagnostics'
            echo '```'
            grep -hE ' error: |✘|BUILD FAILED|TEST FAILED|ARCHIVE FAILED|\*\* .* FAILED|Testing failed' \
              build.log test.log package-test.log archive.log 2>/dev/null | sort -u | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
