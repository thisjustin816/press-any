name: Update gameplay preset copy

on:
  push:
    branches:
      - feature/gameplay-presets
    paths:
      - Scripts/update-gameplay-preset-copy.py
      - .github/workflows/update-gameplay-preset-copy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Update copy
        run: python3 Scripts/update-gameplay-preset-copy.py
      - name: Check diff
        run: git diff --check
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "Justin Beeson"
          git config user.email "41129295+thisjustin816@users.noreply.github.com"
          git add App/AppContainer.swift docs/backlog.md docs/mvp-verification.md docs/product.md
          git commit -m "Update gameplay preset product copy"
          git push origin HEAD:feature/gameplay-presets
