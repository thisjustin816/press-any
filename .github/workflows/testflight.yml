name: TestFlight

# Manual only: archives the app in Release, signs it with the team's cloud-managed distribution
# certificate, and uploads it to TestFlight, so a build ships only when someone chooses to.
# Setup and the secrets it needs are in docs/release.md.

on:
  workflow_dispatch:

permissions:
  contents: read

# Two uploads at once would race for the same build number.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Check the signing secrets are set
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [[ -n "$API_KEY" ]] || missing+=(APP_STORE_CONNECT_API_KEY_P8)
          [[ -n "$KEY_ID" ]] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [[ -n "$ISSUER_ID" ]] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [[ -n "$TEAM_ID" ]] || missing+=(APPLE_TEAM_ID)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See docs/release.md."
            exit 1
          fi
      - name: Install XcodeGen and RGBDS
        run: brew install xcodegen rgbds
      - name: Bootstrap (boot ROMs and Xcode project)
        run: make bootstrap
      - name: Write the App Store Connect key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_KEY" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      # The run number makes each build number new, and the attempt keeps a re-run from reusing it.
      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project PressAny.xcodeproj -scheme PressAny -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PressAny.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee archive.log
      - name: Check the privacy manifest in the archived app
        run: ./Scripts/verify-privacy-manifest.sh "$RUNNER_TEMP/PressAny.xcarchive/Products/Applications/PressAny.app"
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp Config/ExportOptions-TestFlight.plist "$options"
          plutil -replace teamID -string "$TEAM_ID" "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PressAny.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee upload.log
      - name: Summarize
        if: always()
        run: |
          version="$(plutil -extract ApplicationProperties.CFBundleShortVersionString raw -o - \
            "$RUNNER_TEMP/PressAny.xcarchive/Info.plist" 2>/dev/null || echo unknown)"
          {
            echo "### TestFlight"
            echo "Version $version, build ${BUILD_NUMBER:-not set}, from ${GITHUB_SHA::7} on $GITHUB_REF_NAME."
            if [[ "${{ job.status }}" == success ]]; then
              echo "Uploaded. App Store Connect processes it before it appears in TestFlight."
            else
              echo '```'
              grep -hE ' error: |error:|BUILD FAILED|ARCHIVE FAILED|EXPORT FAILED|\*\* .* FAILED' archive.log upload.log 2>/dev/null \
                | sort -u | head -60
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
