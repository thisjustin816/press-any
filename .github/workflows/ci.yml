name: CI

# Host-level checks that run on Linux without Xcode. Apple SDK, simulator and device
# gates live in ios-build.yml and docs/mvp-verification.md.
#
# The package tests cover layers L1 to L3 of docs/acceptance-matrix.md: domain and application
# logic, real storage and persistence, and headless SameBoy.

on:
  # A change to docs alone can't break a build or a test, so it starts no run.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every test target runs here, so a new one needs no change to this file.
  package-tests:
    name: Package tests and headless SameBoy
    runs-on: ubuntu-24.04
    container: swift:6.1.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install package and boot ROM build tools
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev bison cmake g++ libpng-dev make pkg-config
      - name: Build RGBDS and the open boot ROMs
        run: |
          git clone -q --depth 1 --branch v0.9.0 https://github.com/gbdev/rgbds /tmp/rgbds
          cmake -S /tmp/rgbds -B /tmp/rgbds/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/rgbds/build -j "$(nproc)" >/dev/null
          cmake --install /tmp/rgbds/build >/dev/null
          make bootroms
      - name: Run the package tests
        run: swift test --package-path Packages/EmulatorKit
      - name: Run C bridge smoke test
        run: ./Scripts/test-sameboy-bridge-linux.sh

  # The gbtoolsid port must match the C tool at the pinned revision. The package tests run the
  # synthetic detector tests; this job adds the comparison, which needs the C tool built.
  toolchain-detection:
    name: Toolchain detection matches gbtoolsid
    runs-on: ubuntu-24.04
    container: swift:6.1.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install SQLite headers, make and Python
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev make python3
      - name: Compare with gbtoolsid
        run: CC=clang ./Scripts/test-toolchain-detection-differential.sh

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject tracked game images, saves and generated Xcode projects
        run: ./Scripts/verify-repo-hygiene.sh
      - name: Lint shell scripts
        run: shellcheck -x --severity=error Scripts/*.sh Scripts/lib/*.sh
      - name: Test the No-Intro data generator
        run: python3 Scripts/tests/test_generate_known_dumps.py
      - name: Remind when the No-Intro data is due for a refresh
        run: python3 Scripts/check-known-dumps-age.py
      - name: Check the third-party notices name every pinned dependency
        run: python3 Scripts/verify-third-party-notices.py
