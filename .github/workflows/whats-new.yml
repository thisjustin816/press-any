name: What's New
run-name: What's New ${{ inputs.version }} (${{ inputs.apply && 'apply' || 'preview' }})

# Sets an App Store version's English What's New from docs/app-store/whats-new/<version>.txt on
# main, so the text is reviewed in a pull request before it reaches App Store Connect. A run
# previews by default; apply writes. Scripts/app-store-whats-new.py refuses a version that isn't
# editable, such as one that's live or in review.
on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store version, such as 1.1. The text is docs/app-store/whats-new/<version>.txt on main
        type: string
        required: true
      apply:
        description: Write the text to App Store Connect. Leave off to preview
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-store-whats-new
  cancel-in-progress: false

jobs:
  whats-new:
    name: Set the App Store What's New
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse a branch other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run What's New from main; it runs this branch's script with the API key."
          exit 1
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::The version must be such as 1.1 or 1.1.1."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            Scripts
            docs/app-store/whats-new
      - name: Preview or write What's New
        env:
          VERSION: ${{ inputs.version }}
          APPLY: ${{ inputs.apply }}
          # Keeps a refusal after its output in the log.
          PYTHONUNBUFFERED: "1"
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Without pipefail, tee's success would hide a refusal.
          set -o pipefail
          write=()
          if [[ $APPLY == true ]]; then write=(--apply); fi
          {
            echo "Text from main at $(git rev-parse --short HEAD)."
            ./Scripts/app-store-whats-new.py --version "$VERSION" --text "docs/app-store/whats-new/$VERSION.txt" \
              "${write[@]}"
          } 2>&1 | tee "$RUNNER_TEMP/whats-new.log"
      # Without the secrets. The log is in a code block, so the text shows as it is sent.
      - name: Summarize
        if: ${{ !cancelled() }}
        run: |
          if [[ ! -s $RUNNER_TEMP/whats-new.log ]]; then exit 0; fi
          {
            echo '```text'
            cat "$RUNNER_TEMP/whats-new.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
