<!doctype html>
<html><body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
const params = new URLSearchParams(location.search);
const variant = location.hash.slice(1) || 'light';
const colorway = params.get('colorway') || 'Default';
const alternateColors = {
    Berry: '#D64B63',
    Grape: '#8152C5',
    Teal: '#168A8A',
    Kiwi: '#78A63F',
    Dandelion: '#E9B735',
};
const canvas = document.getElementById('c');
const context = canvas.getContext('2d');

async function assetColor(name, dark) {
    const response = await fetch(`../../App/Assets.xcassets/${name}.colorset/Contents.json`);
    if (!response.ok) throw new Error(`Cannot read ${name}`);
    const asset = await response.json();
    const entry = asset.colors.find(color => dark
        ? color.appearances?.some(appearance => appearance.value === 'dark')
        : !color.appearances);
    const components = entry.color.components;
    return '#' + ['red', 'green', 'blue'].map(channel =>
        Number(components[channel]).toString(16).padStart(2, '0')).join('');
}

function shade(hex, amount) {
    const rgb = hex.slice(1).match(/../g).map(channel => parseInt(channel, 16));
    return '#' + rgb.map(channel => Math.round(amount < 0
        ? channel * (1 + amount)
        : channel + (255 - channel) * amount).toString(16).padStart(2, '0')).join('');
}

function ellipse(y, radiusX, radiusY) {
    context.beginPath();
    context.ellipse(512, y, radiusX, radiusY, 0, 0, Math.PI * 2);
}

async function draw() {
    const dark = variant === 'dark';
    const tinted = variant === 'tinted';
    const [body, ink, pink] = await Promise.all([
        assetColor('BrandBody', dark),
        assetColor('BrandInk', dark),
        assetColor('BrandButton', dark),
    ]);
    if (colorway !== 'Default' && !(colorway in alternateColors)) {
        throw new Error(`Unknown colorway ${colorway}`);
    }
    const faceColor = tinted ? '#D0D0D0' : alternateColors[colorway] || pink;
    if (!tinted) {
        context.fillStyle = body;
        context.fillRect(0, 0, 1024, 1024);
    }

    // Near-front view preserves the circular face while showing the short lower sidewall.
    const faceY = 402, radiusX = 230, radiusY = 225, depth = 25;
    context.save();
    context.shadowColor = 'rgba(0,0,0,0.24)';
    context.shadowBlur = 20;
    context.shadowOffsetY = 12;
    context.fillStyle = shade(faceColor, -0.5);
    ellipse(faceY + depth, radiusX + 5, radiusY + 4);
    context.fill();
    context.restore();

    context.fillStyle = shade(faceColor, -0.36);
    ellipse(faceY + depth, radiusX, radiusY);
    context.fill();
    const bevel = context.createLinearGradient(0, faceY - radiusY, 0, faceY + radiusY);
    bevel.addColorStop(0, shade(faceColor, 0.15));
    bevel.addColorStop(1, shade(faceColor, -0.16));
    context.fillStyle = bevel;
    ellipse(faceY, radiusX, radiusY);
    context.fill();
    context.fillStyle = faceColor;
    ellipse(faceY, radiusX - 12, radiusY - 12);
    context.fill();

    // A separate path keeps the printed letter's openings clear in the Tinted icon too.
    context.save();
    context.translate(512, 790);
    context.scale(0.8, 0.8);
    context.fillStyle = tinted ? '#FFFFFF' : ink;
    const letter = new Path2D();
    letter.moveTo(-80, 62);
    letter.lineTo(-80, -22);
    letter.quadraticCurveTo(-80, -64, -36, -64);
    letter.lineTo(36, -64);
    letter.quadraticCurveTo(80, -64, 80, -22);
    letter.lineTo(80, 62);
    letter.quadraticCurveTo(80, 68, 74, 68);
    letter.lineTo(44, 68);
    letter.quadraticCurveTo(38, 68, 38, 62);
    letter.lineTo(38, 34);
    letter.quadraticCurveTo(38, 28, 32, 28);
    letter.lineTo(-32, 28);
    letter.quadraticCurveTo(-38, 28, -38, 34);
    letter.lineTo(-38, 62);
    letter.quadraticCurveTo(-38, 68, -44, 68);
    letter.lineTo(-74, 68);
    letter.quadraticCurveTo(-80, 68, -80, 62);
    letter.closePath();
    letter.roundRect(-34, -34, 68, 30, 8);
    context.fill(letter, 'evenodd');
    context.restore();
    document.body.setAttribute('data-png', canvas.toDataURL('image/png'));
}
draw().catch(error => document.body.setAttribute('data-error', error.message));
</script>
</body></html>
