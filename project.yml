name: PressAny
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  EmulatorKit:
    path: Packages/EmulatorKit
targets:
  PressAny:
    type: application
    platform: iOS
    sources:
      - path: App
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thisjustin816.PressAny$(BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: PressAny
        INFOPLIST_KEY_CFBundleDisplayName: Press Any
        # Without a launch screen, iOS runs the app letterboxed at an old iPhone's size.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: EmulatorKit
        product: EmulatorDomain
      - package: EmulatorKit
        product: EmulatorApplication
      - package: EmulatorKit
        product: AssetStorage
      - package: EmulatorKit
        product: PersistenceGRDB
      - package: EmulatorKit
        product: Importing
      - package: EmulatorKit
        product: Patching
      - package: EmulatorKit
        product: EmulationCore
      - package: EmulatorKit
        product: SameBoyAdapter
      - package: EmulatorKit
        product: EmulationSession
      - package: EmulatorKit
        product: QuickPlay
      - package: EmulatorKit
        product: GameplayInput
      - package: EmulatorKit
        product: ToolchainDetection
  PressAnyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: PressAny
  # Opens the pop-up menus for the screenshot workflow; only the PressAnyScreenshots scheme runs it.
  PressAnyScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScreenshotTests
    dependencies:
      - target: PressAny
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thisjustin816.PressAnyScreenshotTests
        TEST_TARGET_NAME: PressAny
schemes:
  PressAny:
    build:
      targets:
        PressAny: all
        PressAnyTests: [test]
    test:
      targets:
        - PressAnyTests
  PressAnyScreenshots:
    build:
      targets:
        PressAny: all
        PressAnyScreenshotTests: [test]
    test:
      config: Debug
      targets:
        - PressAnyScreenshotTests
